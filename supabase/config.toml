project_id = "pumpshield"
[auth]
site_url = "https://pumpshield-m-abdullah-fawads-projects.vercel.app"
additional_redirect_urls = ["https://pumpshield-seven.vercel.app/auth/callback", "https://pumpshield-seven.vercel.app/auth/callback?next=/auth/password", "https://pumpshield-m-abdullah-fawads-projects.vercel.app/auth/callback", "https://pumpshield-m-abdullah-fawads-projects.vercel.app/auth/callback?next=/auth/password", "http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/auth/password"]
# Local Auth policy; configure the hosted project separately before release.
# Existing passwords remain usable for sign-in.
minimum_password_length = 15
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enable_signup = true
enable_confirmations = true

# Desired local/future-hosted templates. The current free hosted project rejected
# customization with its default provider; see docs/email-delivery-2026-11-10.md.
# Committing this config does not apply hosted settings or configure SMTP.
[auth.email.template.confirmation]
subject = "Confirm your PumpShield account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your PumpShield password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Your PumpShield invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new PumpShield email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Sign in to PumpShield"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.reauthentication]
subject = "Your PumpShield verification code"
content_path = "./supabase/templates/reauthentication.html"
